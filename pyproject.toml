[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camper-monitor"
version = "0.1.0"
description = "Monitor Movacar and roadsurfer Rally offers and send Telegram alerts"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
camper-monitor = "camper_monitor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
