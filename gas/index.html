<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Camper Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--tg-theme-bg-color, #17212b);
      --card: var(--tg-theme-section-bg-color, #1f2a38);
      --section: var(--tg-theme-secondary-bg-color, #232e3c);
      --text: var(--tg-theme-text-color, #ffffff);
      --subtext: var(--tg-theme-subtitle-text-color, #9aa7b5);
      --hint: var(--tg-theme-hint-color, #75838f);
      --accent: var(--tg-theme-button-color, #2ea6ff);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
      --danger: var(--tg-theme-destructive-text-color, #ff5b66);
      --success: #4cd964;
      --border: rgba(255, 255, 255, 0.08);
    }
    html, body { background: var(--bg); color: var(--text); }
    body {
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 10px 12px 110px;
      -webkit-tap-highlight-color: transparent;
    }
    .container { max-width: 520px; margin: 0 auto; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--hint);
      margin-bottom: 10px;
    }
    .field { margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }
    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--subtext);
      margin-bottom: 6px;
    }

    /* Status banner */
    .banner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: linear-gradient(135deg, var(--section), var(--card));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .banner .emoji { font-size: 22px; line-height: 1.1; }
    .banner-title { font-weight: 700; font-size: 16px; }
    .banner-sub { color: var(--subtext); font-size: 13px; margin-top: 3px; }
    .banner-sub .ok { color: var(--success); font-weight: 600; }
    .banner.stale { border-color: var(--danger); background: rgba(255, 91, 102, 0.12); }
    .banner.stale .banner-title { color: var(--danger); }

    /* Chips */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border: 1px solid var(--border);
      background: var(--section);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 13px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .chip.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    /* Segmented interval */
    .seg { display: flex; gap: 6px; flex-wrap: wrap; }
    .seg button {
      flex: 1;
      min-width: 52px;
      border: 1px solid var(--border);
      background: var(--section);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 0;
      font-size: 14px;
      cursor: pointer;
    }
    .seg button.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--section);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    select:focus, input:focus { border-color: var(--accent); }

    /* Route cards */
    .route {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .route-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
    }
    .route-head .src {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--accent);
      background: var(--section);
      padding: 3px 8px;
      border-radius: 999px;
    }
    .route-foot {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      color: var(--subtext);
      font-size: 13px;
    }
    .route-foot .spacer { flex: 1; }

    /* Toggle switch */
    .switch { position: relative; display: inline-block; width: 44px; height: 26px; flex: 0 0 auto; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider {
      position: absolute; inset: 0;
      background: var(--section);
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: background 0.15s;
    }
    .switch .slider:before {
      content: "";
      position: absolute;
      width: 18px; height: 18px;
      left: 3px; top: 3px;
      background: var(--hint);
      border-radius: 50%;
      transition: transform 0.15s, background 0.15s;
    }
    .switch input:checked + .slider { background: var(--accent); border-color: var(--accent); }
    .switch input:checked + .slider:before { transform: translateX(18px); background: #fff; }

    .delete-link {
      border: none;
      background: none;
      color: var(--hint);
      font-size: 15px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 8px;
    }
    .delete-link:active { color: var(--danger); }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-accent { background: var(--accent); color: var(--accent-text); }
    .btn-secondary {
      background: var(--section);
      color: var(--accent);
      border: 1px solid var(--accent);
      margin-top: 8px;
    }
    .btn:disabled { opacity: 0.6; }
    .link-reset {
      display: block;
      text-align: center;
      margin-top: 14px;
      color: var(--hint);
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
    }
    .add-route {
      width: 100%;
      border: 1px dashed var(--hint);
      background: none;
      color: var(--subtext);
      border-radius: 14px;
      padding: 13px;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .empty-hint { color: var(--hint); font-size: 13px; text-align: center; padding: 10px 0; }

    .route-edit input, .route-edit select { margin-bottom: 8px; font-size: 14px; padding: 10px 11px; }
    .route-edit .pair { display: flex; gap: 8px; }
    .route-edit .pair > div { flex: 1; }

    /* Toast */
    #toast {
      position: fixed;
      left: 50%;
      bottom: 78px;
      transform: translateX(-50%) translateY(20px);
      background: var(--section);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 10;
      max-width: 90vw;
      text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.err { color: var(--danger); }

    /* Tab nav */
    .tab-nav {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      background: var(--section);
      padding: 4px;
      border-radius: 12px;
    }
    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--subtext);
      padding: 10px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .tab-btn.selected {
      background: var(--card);
      color: var(--text);
    }

    /* Offers screen */
    .filters-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .filters-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--section);
      color: var(--text);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .filter-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .offer-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .offer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .offer-route {
      font-weight: 700;
      font-size: 14px;
    }
    .offer-route .flag { margin-right: 4px; }
    .offer-source {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--accent);
      background: var(--section);
      padding: 3px 8px;
      border-radius: 999px;
    }
    .offer-dates {
      color: var(--subtext);
      font-size: 13px;
      margin-bottom: 6px;
    }
    .offer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .offer-price {
      font-size: 18px;
      font-weight: 800;
      color: var(--success);
    }
    .offer-status {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .offer-status.new { background: rgba(46, 166, 255, 0.2); color: var(--accent); }
    .offer-status.sent { background: rgba(76, 217, 100, 0.15); color: var(--success); }

    .btn-book {
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-book:disabled { opacity: 0.5; }

    .btn-delete-offer {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 14px;
      cursor: pointer;
      color: var(--hint);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-delete-offer:hover {
      background: rgba(255, 59, 48, 0.15);
      border-color: #ff3b30;
    }
    .btn-delete-offer:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-check-avail {
      background: var(--section);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn-check-avail:hover {
      background: rgba(46, 166, 255, 0.15);
    }
    .btn-check-avail:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .offer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .offers-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--hint);
    }
    .offers-empty .icon { font-size: 48px; margin-bottom: 12px; }

    .offers-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--subtext);
    }
    .offers-pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
    }
    .offers-pagination button {
      border: 1px solid var(--border);
      background: var(--section);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    .offers-pagination button:disabled { opacity: 0.4; }

    .filter-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .filter-panel h4 {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--hint);
      margin-bottom: 8px;
    }
    .filter-panel select, .filter-panel input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--section);
      color: var(--text);
      font-size: 14px;
      margin-bottom: 8px;
    }
    .filter-row {
      display: flex;
      gap: 8px;
    }
    .filter-row > * { flex: 1; }
  
.routes-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.routes-table th { text-align: left; padding: 6px 4px; color: var(--subtext); border-bottom: 1px solid var(--border); font-weight: 600; font-size: 10px; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
.routes-table td { padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,0.06); vertical-align: middle; letter-spacing: 0.2px; }
.routes-table input { width: 100%; min-width: 50px; padding: 4px; font-size: 11px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
.routes-table td:first-child { white-space: nowrap; }
</style>
</head>
<body>
  <div class="container">

    <div class="banner" id="banner">
      <div class="emoji">🟢</div>
      <div>
        <div class="banner-title" id="bannerTitle">Загрузка…</div>
        <div class="banner-sub" id="bannerSub"></div>
      </div>
    </div>

    <div id="mainForm">
      <div class="tab-nav" id="tabNav" style="display:none;">
      <button type="button" class="tab-btn selected" id="tabSettings" onclick="switchTab('settings')">⚙️ Настройки</button>
      <button type="button" class="tab-btn" id="tabOffers" onclick="switchTab('offers')">🎫 Офферы</button>
    </div>

    <div id="screenSettings">
    <div class="card" id="healthCard">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <div class="card-title" style="margin-bottom:0;">🌐 Статус связи с сайтами</div>
          <button type="button" style="background:none; border:none; color:var(--accent); font-size:12px; font-weight:600; cursor:pointer;" onclick="checkHealth()">🔄 Обновить</button>
        </div>
        <div style="font-size:13px; line-height:1.6;">
          <div style="display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--border);">
            <span>🚐 Roadsurfer Rally</span>
            <span id="healthRs" style="color:var(--hint);">Проверка…</span>
          </div>
          <div style="display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--border);">
            <span>🚗 Movacar API</span>
            <span id="healthMv" style="color:var(--hint);">Проверка…</span>
          </div>
          <div style="display:flex; justify-content:space-between; padding:4px 0;">
            <span>🤖 Telegram Bot</span>
            <span id="healthTg" style="color:var(--hint);">Проверка…</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Настройки</div>
        <div class="field">
          <span class="field-label">Интервал опроса, мин</span>
          <div class="seg" id="intervalSeg"></div>
        </div>
        <div class="field">
          <span class="field-label">Окно поиска, дней</span>
          <div class="seg" id="windowSeg"></div>
        </div>
        <div class="field">
          <label class="field-label" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0;">
            <span>Telegram-уведомления</span>
            <span class="switch">
              <input type="checkbox" id="telegramEnabled">
              <span class="slider"></span>
            </span>
          </label>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Страны отправления</div>
        <div class="chips" id="originChips"></div>
      </div>

      <div class="card">
        <div class="card-title">Страны назначения</div>
        <div class="chips" id="destChips"></div>
      </div>

      <div class="card">
        <div class="card-title">Маршруты</div>
        <div id="routesList"></div>
        <button type="button" class="add-route" id="btnAddRoute">+ Добавить маршрут</button>
      </div>

      <button type="button" class="btn btn-secondary" id="btnRun">▶ Запустить проверку</button>
      <button type="button" class="btn btn-secondary" id="btnTriggers" style="margin-top:8px;">🔧 Восстановить триггеры</button>
      <button type="button" class="btn btn-accent" id="btnSave">Сохранить</button>
      <button type="button" class="link-reset" id="btnReset">Сбросить несохранённые изменения</button>
    </div>
    </div>

    <div id="screenOffers" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px;">
        <div class="filters-bar" id="sourceFilters" style="margin-bottom:0; flex-grow:1;"></div>
        <button type="button" class="btn-check-avail" id="btnCheckAvail" title="Проверить доступность офферов у провайдеров и удалить недоступные">🔄 Проверить доступность</button>
      </div>

      <div class="offers-summary" id="offersSummary"></div>

      <div id="offersList"></div>

      <div class="offers-pagination" id="offersPagination"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    var state = null;
    var currentTab = 'settings';
    var offersData = null;
    var offerFilters = { source: '', sentStatus: '', page: 1 };
    var INTERVALS = [1, 5, 10, 15, 30];
    var WINDOWS = [7, 10, 14, 21, 30];
    var tg = window.Telegram && Telegram.WebApp ? Telegram.WebApp : null;
    var toastTimer = null;

    function getInitData() {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
        return window.Telegram.WebApp.initData;
      }
      return '';
    }

    function switchTab(tab) {
      currentTab = tab;
      var settingsBtn = document.getElementById('tabSettings');
      var offersBtn = document.getElementById('tabOffers');
      var screenSettings = document.getElementById('screenSettings');
      var screenOffers = document.getElementById('screenOffers');
      if (settingsBtn) settingsBtn.classList.toggle('selected', tab === 'settings');
      if (offersBtn) offersBtn.classList.toggle('selected', tab === 'offers');
      if (screenSettings) screenSettings.style.display = tab === 'settings' ? '' : 'none';
      if (screenOffers) screenOffers.style.display = tab === 'offers' ? '' : 'none';
      if (tab === 'offers') loadOffers();
    }

    function loadOffers() {
      var initData = getInitData();
      google.script.run
        .withSuccessHandler(function (result) {
          offersData = result;
          renderSourceFilters();
          renderOffers();
        })
        .withFailureHandler(function (err) {
          toast((err && err.message) || 'Ошибка загрузки офферов', true);
        })
        .getOffers({ page: offerFilters.page, limit: 50 }, initData);
    }

    function renderSourceFilters() {
      var container = document.getElementById('sourceFilters');
      container.innerHTML = '';
      var sources = ['roadsurfer', 'movacar'];
      sources.forEach(function (src) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'filter-chip' + (offerFilters.source === src ? ' active' : '');
        chip.textContent = src === 'roadsurfer' ? '🚐 Roadsurfer' : '🚗 Movacar';
        chip.onclick = function () {
          offerFilters.source = offerFilters.source === src ? '' : src;
          offerFilters.page = 1;
          applyOfferFilters();
        };
        container.appendChild(chip);
      });
      // Status filters
      var statusChips = [
        { value: '', label: 'Все' },
        { value: 'new', label: 'Новые' },
        { value: 'sent', label: 'Отправлены' }
      ];
      statusChips.forEach(function (s) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'filter-chip' + (offerFilters.sentStatus === s.value ? ' active' : '');
        chip.textContent = s.label;
        chip.onclick = function () {
          offerFilters.sentStatus = s.value;
          offerFilters.page = 1;
          applyOfferFilters();
        };
        container.appendChild(chip);
      });
    }

    function applyOfferFilters() {
      var initData = getInitData();
      var filter = {
        page: offerFilters.page,
        limit: 50
      };
      if (offerFilters.source) { filter.source = offerFilters.source; }
      if (offerFilters.sentStatus) { filter.sentStatus = offerFilters.sentStatus; }
      google.script.run
        .withSuccessHandler(function (result) {
          offersData = result;
          renderSourceFilters();
          renderOffers();
        })
        .withFailureHandler(function (err) {
          toast((err && err.message) || 'Ошибка фильтрации', true);
        })
        .getOffers(filter, initData);
    }

    function renderOffers() {
      var list = document.getElementById('offersList');
      var summary = document.getElementById('offersSummary');
      var pagination = document.getElementById('offersPagination');
      list.innerHTML = '';
      pagination.innerHTML = '';

      if (!offersData || !offersData.offers || !offersData.offers.length) {
        list.innerHTML = '<div class="offers-empty"><div class="icon">🎫</div><div>Офферы не найдены</div></div>';
        summary.innerHTML = '0 офферов';
        return;
      }

      summary.textContent = 'Найдено: ' + offersData.total + ' | Стр. ' + offersData.page + ' / ' + offersData.totalPages;

      offersData.offers.forEach(function (offer) {
        list.appendChild(buildOfferCard(offer));
      });

      // Pagination
      if (offersData.totalPages > 1) {
        var prev = document.createElement('button');
        prev.textContent = '← Назад';
        prev.disabled = offersData.page <= 1;
        prev.onclick = function () {
          offerFilters.page = offersData.page - 1;
          applyOfferFilters();
        };
        pagination.appendChild(prev);

        var next = document.createElement('button');
        next.textContent = 'Вперёд →';
        next.disabled = offersData.page >= offersData.totalPages;
        next.onclick = function () {
          offerFilters.page = offersData.page + 1;
          applyOfferFilters();
        };
        pagination.appendChild(next);
      }
    }

    function buildOfferCard(offer) {
      var card = document.createElement('div');
      card.className = 'offer-card';

      // Header with route and source
      var header = document.createElement('div');
      header.className = 'offer-header';
      var route = document.createElement('div');
      route.className = 'offer-route';
      route.innerHTML = '<span class="flag">' + flagEmoji(offer.originCountry) + '</span>' +
        (offer.origin || '—') + ' → <span class="flag">' + flagEmoji(offer.destinationCountry) + '</span>' +
        (offer.destination || '—');
      header.appendChild(route);
      var sourceBadge = document.createElement('span');
      sourceBadge.className = 'offer-source';
      sourceBadge.textContent = offer.source;
      header.appendChild(sourceBadge);
      card.appendChild(header);

      // Dates
      var dates = document.createElement('div');
      dates.className = 'offer-dates';
      dates.textContent = (offer.pickupDate ? shortDate(offer.pickupDate) : '—') + ' — ' +
        (offer.returnDate ? shortDate(offer.returnDate) : '—');
      if (offer.vehicle) {
        dates.textContent += ' | ' + offer.vehicle;
      }
      card.appendChild(dates);

      // Footer with price, status, book button
      var footer = document.createElement('div');
      footer.className = 'offer-footer';

      var price = document.createElement('div');
      price.className = 'offer-price';
      price.textContent = (offer.price != null ? offer.price + ' ' + offer.currency : '—');
      footer.appendChild(price);

      var status = document.createElement('span');
      status.className = 'offer-status ' + (offer.telegramSentAt ? 'sent' : 'new');
      status.textContent = offer.telegramSentAt ? '✓ Отправлен' : 'Новый';
      footer.appendChild(status);

      var actions = document.createElement('div');
      actions.className = 'offer-actions';

      var deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'btn-delete-offer';
      deleteBtn.innerHTML = '🗑️';
      deleteBtn.title = 'Удалить этот оффер';
      deleteBtn.onclick = function (e) {
        e.stopPropagation();
        if (!window.confirm('Удалить этот оффер?')) return;
        deleteBtn.disabled = true;
        deleteBtn.textContent = '⏳';
        var initData = getInitData();
        google.script.run
          .withSuccessHandler(function (res) {
            toast('Оффер удалён');
            card.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
            card.style.opacity = '0';
            card.style.transform = 'scale(0.95)';
            setTimeout(function () {
              if (card.parentNode) {
                card.parentNode.removeChild(card);
              }
              if (offersData && offersData.offers) {
                offersData.offers = offersData.offers.filter(function (o) {
                  return o.fingerprint !== offer.fingerprint;
                });
                offersData.total = Math.max(0, (offersData.total || 1) - 1);
                var summary = document.getElementById('offersSummary');
                if (summary) {
                  summary.textContent = 'Найдено: ' + offersData.total + ' | Стр. ' + offersData.page + ' / ' + offersData.totalPages;
                }
                if (offersData.offers.length === 0) {
                  applyOfferFilters();
                }
              }
            }, 250);
          })
          .withFailureHandler(function (err) {
            deleteBtn.disabled = false;
            deleteBtn.innerHTML = '🗑️';
            toast((err && err.message) || 'Ошибка при удалении оффера', true);
          })
          .deleteOffer(offer.fingerprint, initData);
      };
      actions.appendChild(deleteBtn);

      var bookBtn = document.createElement('button');
      bookBtn.type = 'button';
      bookBtn.className = 'btn-book';
      bookBtn.textContent = 'Бронировать';
      bookBtn.disabled = !offer.bookingUrl;
      if (offer.bookingUrl) {
        bookBtn.onclick = function () {
          if (tg) {
            tg.openLink(offer.bookingUrl);
          } else {
            window.open(offer.bookingUrl, '_blank');
          }
        };
      }
      actions.appendChild(bookBtn);

      footer.appendChild(actions);
      card.appendChild(footer);
      return card;
    }

    function checkAvailability() {
      var btn = document.getElementById('btnCheckAvail');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Проверка...';
      }
      var initData = getInitData();
      google.script.run
        .withSuccessHandler(function (res) {
          if (btn) {
            btn.disabled = false;
            btn.textContent = '🔄 Проверить доступность';
          }
          var msg = 'Проверка доступности завершена.';
          if (res && res.removed !== undefined) {
            msg = res.removed > 0
              ? 'Удалено недоступных офферов: ' + res.removed + ' (из ' + res.checked + ')'
              : 'Все проверенные офферы (' + res.checked + ') актуальны';
          }
          toast(msg);
          applyOfferFilters();
        })
        .withFailureHandler(function (err) {
          if (btn) {
            btn.disabled = false;
            btn.textContent = '🔄 Проверить доступность';
          }
          toast((err && err.message) || 'Ошибка при проверке доступности', true);
        })
        .checkOffersAvailabilityWeb(initData);
    }

    function getInitData() {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
        return window.Telegram.WebApp.initData;
      }
      return '';
    }

    function showAccessDenied(msg) {
      var banner = document.getElementById('banner');
      if (banner) {
        var emoji = banner.querySelector('.emoji');
        if (emoji) emoji.textContent = '🔒';
        var title = document.getElementById('bannerTitle');
        if (title) title.textContent = 'Доступ запрещён';
        var sub = document.getElementById('bannerSub');
        if (sub) sub.textContent = msg || 'Откройте приложение через Telegram бота.';
      }
      var form = document.getElementById('mainForm');
      if (form) form.style.display = 'none';
    }

    function init() {
      if (tg && getInitData()) {
        tg.ready();
        tg.expand();
        tg.MainButton.setText('Сохранить').onClick(function () { saveSettings(); }).show();
        document.getElementById('btnSave').style.display = 'none';
      }
      document.getElementById('btnRun').onclick = runCheck;
      var btnTriggers = document.getElementById('btnTriggers');
      if (btnTriggers) btnTriggers.onclick = installTriggers;
      var btnCheckAvail = document.getElementById('btnCheckAvail');
      if (btnCheckAvail) btnCheckAvail.onclick = checkAvailability;
      document.getElementById('btnAddRoute').onclick = addRoute;
      document.getElementById('btnSave').onclick = saveSettings;
      document.getElementById('btnReset').onclick = function () {
        if (window.confirm('Отменить все несохранённые изменения?')) {
          load();
        }
      };
      document.getElementById('telegramEnabled').onchange = function () {
        state.settings.telegram_enabled = this.checked;
      };
      // Show offers tab only in development (when skipAuth is enabled)
      var tabNav = document.getElementById('tabNav');
      google.script.run.withSuccessHandler(function(data) {
        if (data && data.offersTabEnabled) {
          tabNav.style.display = 'flex';
        }
      }).withFailureHandler(function() {}).getUiData(getInitData());
      load();
    }

    function load() {
      var initData = getInitData();
      google.script.run
        .withSuccessHandler(function (data) {
          var form = document.getElementById('mainForm');
          if (form) form.style.display = 'block';
          render(data);
        })
        .withFailureHandler(function (err) {
          var msg = (err && err.message) || err || 'Ошибка загрузки';
          showAccessDenied(msg);
          toast(msg, true);
        })
        .getUiData(initData);
      checkHealth();
    }

    function checkHealth() {
      var initData = getInitData();
      var rs = document.getElementById('healthRs');
      var mv = document.getElementById('healthMv');
      var tg = document.getElementById('healthTg');
      if (rs) { rs.textContent = '⏳ Проверка…'; rs.style.color = 'var(--hint)'; }
      if (mv) { mv.textContent = '⏳ Проверка…'; mv.style.color = 'var(--hint)'; }
      if (tg) { tg.textContent = '⏳ Проверка…'; tg.style.color = 'var(--hint)'; }

      google.script.run
        .withSuccessHandler(function (h) {
          if (!h) return;
          if (rs && h.roadsurfer) {
            rs.textContent = (h.roadsurfer.ok ? '🟢 ' : '🔴 ') + h.roadsurfer.message;
            rs.style.color = h.roadsurfer.ok ? 'var(--success)' : 'var(--danger)';
          }
          if (mv && h.movacar) {
            mv.textContent = (h.movacar.ok ? '🟢 ' : '🔴 ') + h.movacar.message;
            mv.style.color = h.movacar.ok ? 'var(--success)' : 'var(--danger)';
          }
          if (tg && h.telegram) {
            tg.textContent = (h.telegram.ok ? '🟢 ' : '🔴 ') + h.telegram.message;
            tg.style.color = h.telegram.ok ? 'var(--success)' : 'var(--danger)';
          }
        })
        .withFailureHandler(function (err) {
          if (rs) rs.textContent = '❌ Ошибка';
        })
        .checkProvidersHealth(initData);
    }

    function render(data) {
      state = data;
      renderStatus();
      renderSettings();
      renderChips();
      renderRoutes();
    }

    function renderStatus() {
      var st = state.status || {};
      var lastRun = st.lastRun;
      var bannerTitle = document.getElementById('bannerTitle');
      var bannerSub = document.getElementById('bannerSub');
      var emoji = '🟢';
      var title = 'Мониторинг активен';
      var parts = ['Триггер каждые ' + st.intervalMinutes + ' мин'];
      var freshness = st.freshness || {};
      var isStale = freshness.isStale === true;

      if (isStale) {
        emoji = '🔴';
        title = freshness.ageMinutes === null
          ? 'Триггер не выполнялся: нет данных'
          : 'Триггер не выполнялся ' + freshness.ageMinutes + ' мин';
        parts.push('Порог: ' + freshness.thresholdMinutes + ' мин');
      }

      if (state.telegramReady === false) {
        parts.push('⚠️ Telegram не настроен');
      }
      if (lastRun) {
        if (!isStale && lastRun.status && String(lastRun.status).toLowerCase() !== 'ok') {
          emoji = '⚠️';
          title = 'Последняя проверка с ошибкой';
          if (lastRun.error) {
            parts.push(String(lastRun.error).slice(0, 80));
          }
        }
        parts.push('Последняя проверка: ' + timeAgo(lastRun.finished_at || lastRun.started_at));
        if (lastRun.offers_found !== undefined && lastRun.offers_found !== null && lastRun.offers_found !== '') {
          parts.push('Офферов: ' + lastRun.offers_found);
        }
      } else {
        parts.push('Ещё не запускался');
      }
      if (state.monitorError) {
        parts.push('⚠️ ' + String(state.monitorError).slice(0, 120));
      }
      bannerSub.innerHTML = '';
      parts.forEach(function (part, i) {
        var span = document.createElement('div');
        span.textContent = part;
        if (i === 0) { span.className = 'ok'; }
        bannerSub.appendChild(span);
      });
      document.querySelector('#banner .emoji').textContent = emoji;
      document.getElementById('banner').classList.toggle('stale', isStale);
      bannerTitle.textContent = title;
    }

    function renderSettings() {
      renderSeg('intervalSeg', INTERVALS,
        String(state.settings.poll_interval_minutes),
        function (v) { state.settings.poll_interval_minutes = v; });
      renderSeg('windowSeg', WINDOWS,
        String(state.settings.window_days),
        function (v) { state.settings.window_days = v; });
      document.getElementById('telegramEnabled').checked = isTruthy(state.settings.telegram_enabled);
    }

    function renderSeg(id, values, selected, onPick) {
      var root = document.getElementById(id);
      root.innerHTML = '';
      values.forEach(function (v) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = v;
        btn.className = String(v) === String(selected) ? 'selected' : '';
        btn.onclick = function () {
          onPick(v);
          Array.prototype.forEach.call(root.children, function (b) { b.classList.remove('selected'); });
          btn.classList.add('selected');
        };
        root.appendChild(btn);
      });
    }

    function renderChips() {
      var countries = state.countries || [];
      renderChipsIn('originChips', countries, state.filters.allowed_origin_countries || [], function (code) {
        toggleCountry(state.filters.allowed_origin_countries, code);
      });
      renderChipsIn('destChips', countries, state.filters.allowed_destination_countries || [], function (code) {
        toggleCountry(state.filters.allowed_destination_countries, code);
      });
    }

    function renderChipsIn(id, countries, selected, onToggle) {
      var root = document.getElementById(id);
      root.innerHTML = '';
      countries.forEach(function (c) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chip' + (selected.indexOf(c[0]) !== -1 ? ' selected' : '');
        btn.textContent = flagEmoji(c[0]) + ' ' + c[1];
        btn.onclick = function () { onToggle(c[0]); };
        root.appendChild(btn);
      });
    }

    function toggleCountry(list, code) {
      var idx = list.indexOf(code);
      if (idx === -1) {
        list.push(code);
      } else {
        list.splice(idx, 1);
      }
      renderChips();
    }

    function renderRoutes() {
      var list = document.getElementById('routesList');
      list.innerHTML = '';
      if (!state.routes.length) {
        var empty = document.createElement('div');
        empty.className = 'empty-hint';
        empty.textContent = 'Нет маршрутов — добавьте';
        list.appendChild(empty);
        return;
      }
      state.routes.forEach(function (route, index) {
        list.appendChild(buildRouteCard(route, index));
      });
    }

    function buildRouteCard(route, index) {
      var card = document.createElement('div');
      card.className = 'route';

      if (route._editing) {
        card.appendChild(buildRouteEditor(route, index));
        return card;
      }

      var head = document.createElement('div');
      head.className = 'route-head';
      head.textContent = flagEmoji(route.originCountry) + ' ' + route.originName + '  ➔  ' +
        flagEmoji(route.destinationCountry) + ' ' + route.destinationName;
      var badge = document.createElement('span');
      badge.className = 'src';
      badge.textContent = route.source;
      head.appendChild(badge);

      var edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'delete-link';
      edit.title = 'Редактировать маршрут';
      edit.textContent = '✏️';
      edit.onclick = function () {
        route._editing = true;
        renderRoutes();
      };
      head.appendChild(edit);
      card.appendChild(head);

      var foot = document.createElement('div');
      foot.className = 'route-foot';
      foot.appendChild(routeDates());
      foot.appendChild(document.createTextNode('(' + state.window.days + ' дн)'));

      var spacer = document.createElement('span');
      spacer.className = 'spacer';
      foot.appendChild(spacer);

      var sw = document.createElement('label');
      sw.className = 'switch';
      var chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.checked = isTruthy(route.enabled);
      chk.onchange = function () {
        route.enabled = chk.checked;
        if (chk.checked) { card.classList.remove('off'); } else { card.classList.add('off'); }
      };
      var slider = document.createElement('span');
      slider.className = 'slider';
      sw.appendChild(chk);
      sw.appendChild(slider);
      foot.appendChild(sw);

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'delete-link';
      del.title = 'Удалить';
      del.textContent = '🗑';
      del.onclick = function () {
        state.routes.splice(index, 1);
        renderRoutes();
      };
      foot.appendChild(del);

      card.appendChild(foot);
      if (!isTruthy(route.enabled)) { card.classList.add('off'); }
      return card;
    }

    function routeDates() {
      var w = state.window;
      return document.createTextNode(shortDate(w.start) + ' — ' + shortDate(w.end) + ' ');
    }

    function buildRouteEditor(route, index) {
      var wrap = document.createElement('div');
      wrap.className = 'route-edit';
      wrap.appendChild(fieldLabel('Источник'));
      wrap.appendChild(select(['roadsurfer', 'movacar'], route.source, function (v) {
        route.source = v;
        renderRoutes();
      }));

      if (route.source === 'roadsurfer') {
        var countries = document.createElement('div');
        countries.className = 'pair';
        countries.appendChild(fieldGroup('Страна отправления', countrySelect(route.originCountry, function (v) {
          route.originCountry = v;
          route.originId = '';
          route.originName = '';
          renderRoutes();
        })));
        countries.appendChild(fieldGroup('Страна назначения', countrySelect(route.destinationCountry, function (v) {
          route.destinationCountry = v;
          route.destinationId = '';
          route.destinationName = '';
          renderRoutes();
        }, true)));
        wrap.appendChild(countries);

        var stations = document.createElement('div');
        stations.className = 'pair';
        stations.appendChild(fieldGroup('Город отправления', roadSurferStationSelect(route, 'origin')));
        stations.appendChild(fieldGroup('Город назначения', roadSurferDestinationSelect(route)));
        wrap.appendChild(stations);
      } else {
        appendManualRouteFields_(wrap, route);
      }

      var btnDone = document.createElement('button');
      btnDone.type = 'button';
      btnDone.className = 'btn btn-accent';
      btnDone.textContent = 'Готово';
      btnDone.onclick = function () {
        route._editing = undefined;
        renderRoutes();
      };
      wrap.appendChild(btnDone);
      return wrap;
    }

    function appendManualRouteFields_(wrap, route) {

      var pair1 = document.createElement('div');
      pair1.className = 'pair';
      var oField = fieldGroup('Откуда (название)', textInput(route.originName, function (v) { route.originName = v; }));
      var oIdField = fieldGroup('origin_id', textInput(route.originId, function (v) { route.originId = v; }));
      pair1.appendChild(oField);
      pair1.appendChild(oIdField);

      var pair2 = document.createElement('div');
      pair2.className = 'pair';
      var dField = fieldGroup('Куда (название)', textInput(route.destinationName, function (v) { route.destinationName = v; }));
      var dIdField = fieldGroup('destination_id', textInput(route.destinationId, function (v) { route.destinationId = v; }));
      pair2.appendChild(dField);
      pair2.appendChild(dIdField);

      var pair3 = document.createElement('div');
      pair3.className = 'pair';
      var oCField = fieldGroup('Страна откуда', countrySelect(route.originCountry, function (v) { route.originCountry = v; }));
      var dCField = fieldGroup('Страна куда', countrySelect(route.destinationCountry, function (v) { route.destinationCountry = v; }));
      pair3.appendChild(oCField);
      pair3.appendChild(dCField);

      wrap.appendChild(pair1);
      wrap.appendChild(pair2);
      wrap.appendChild(pair3);
    }

    function roadSurferStationSelect(route, kind) {
      var idKey = kind === 'origin' ? 'originId' : 'destinationId';
      var nameKey = kind === 'origin' ? 'originName' : 'destinationName';
      var country = kind === 'origin' ? route.originCountry : route.destinationCountry;
      var sel = document.createElement('select');
      sel.disabled = true;
      var loading = document.createElement('option');
      loading.textContent = country ? 'Загрузка городов…' : 'Сначала выберите страну';
      loading.value = '';
      sel.appendChild(loading);
      if (!country) return sel;

      google.script.run
        .withSuccessHandler(function (stations) {
          sel.innerHTML = '';
          var placeholder = document.createElement('option');
          placeholder.value = '';
          placeholder.textContent = 'Выберите город';
          sel.appendChild(placeholder);
          stations.forEach(function (station) {
            var option = document.createElement('option');
            option.value = station.id;
            option.textContent = station.name;
            option.dataset.name = station.name;
            sel.appendChild(option);
          });
          sel.value = String(route[idKey] || '');
          sel.disabled = false;
          sel.onchange = function () {
            var prevId = route[idKey];
            route[idKey] = sel.value;
            route[nameKey] = sel.options[sel.selectedIndex].dataset.name || '';
            if (kind === 'origin' && prevId !== route.originId) {
              route.destinationId = '';
              route.destinationName = '';
              renderRoutes();
            }
          };
        })
        .withFailureHandler(function () {
          loading.textContent = 'Не удалось загрузить города';
        })
        .getRoadsurferStations([country], getInitData());
      return sel;
    }

    function roadSurferDestinationSelect(route) {
      var sel = document.createElement('select');
      sel.disabled = true;
      var loading = document.createElement('option');
      loading.value = '';
      if (!route.originId) {
        loading.textContent = 'Сначала выберите город отправления';
        sel.appendChild(loading);
        return sel;
      }
      loading.textContent = 'Загрузка направлений…';
      sel.appendChild(loading);

      var expectedOriginId = String(route.originId);
      var countryFilter = route.destinationCountry ? [route.destinationCountry] : [];
      google.script.run
        .withSuccessHandler(function (destinations) {
          if (String(route.originId) !== expectedOriginId) {
            return;
          }
          sel.innerHTML = '';
          if (!destinations || !destinations.length) {
            var emptyOpt = document.createElement('option');
            emptyOpt.value = '';
            emptyOpt.textContent = route.destinationCountry
              ? 'Нет направлений в эту страну'
              : 'Нет доступных направлений';
            sel.appendChild(emptyOpt);
            route.destinationId = '';
            route.destinationName = '';
            return;
          }

          var placeholder = document.createElement('option');
          placeholder.value = '';
          placeholder.textContent = 'Выберите город (' + destinations.length + ' доступно)';
          sel.appendChild(placeholder);

          var hasCurrent = false;
          destinations.forEach(function (station) {
            var option = document.createElement('option');
            option.value = String(station.id);
            option.textContent = station.name + (station.country ? ' (' + station.country + ')' : '');
            option.dataset.name = station.name;
            option.dataset.country = station.country || '';
            if (String(route.destinationId) === String(station.id)) {
              hasCurrent = true;
            }
            sel.appendChild(option);
          });

          if (!hasCurrent) {
            route.destinationId = '';
            route.destinationName = '';
          }
          sel.value = String(route.destinationId || '');
          sel.disabled = false;
          sel.onchange = function () {
            route.destinationId = sel.value;
            var opt = sel.options[sel.selectedIndex];
            route.destinationName = (opt && opt.dataset.name) || '';
            if (opt && opt.dataset.country && (!route.destinationCountry || route.destinationCountry !== opt.dataset.country)) {
              route.destinationCountry = opt.dataset.country;
            }
          };
        })
        .withFailureHandler(function () {
          if (String(route.originId) !== expectedOriginId) return;
          loading.textContent = 'Не удалось загрузить направления';
        })
        .getRoadsurferDestinations(route.originId, countryFilter, getInitData());
      return sel;
    }

    function addRoute() {
      var route = {
        enabled: true,
        source: 'roadsurfer',
        originName: 'Berlin',
        originId: '6',
        destinationName: 'Rome Fiumicino Airport',
        destinationId: '35',
        originCountry: 'DE',
        destinationCountry: 'IT',
        _editing: true
      };
      state.routes.push(route);
      renderRoutes();
    }

    function saveSettings() {
      var initData = getInitData();
      var payload = {
        settings: {
          poll_interval_minutes: state.settings.poll_interval_minutes,
          window_days: state.settings.window_days,
          telegram_enabled: state.settings.telegram_enabled
        },
        filters: {
          allowed_origin_countries: (state.filters.allowed_origin_countries || []).slice(),
          allowed_destination_countries: (state.filters.allowed_destination_countries || []).slice()
        },
        routes: state.routes.map(function (r) {
          var copy = {};
          Object.keys(r).forEach(function (k) { if (k !== '_editing') { copy[k] = r[k]; } });
          return copy;
        })
      };
      google.script.run
        .withSuccessHandler(function () { toast('Сохранено ✓'); setTimeout(load, 600); })
        .withFailureHandler(function (err) { toast((err && err.message) || 'Ошибка сохранения', true); })
        .saveUiData(payload, initData);
    }

    function installTriggers() {
      var initData = getInitData();
      google.script.run
        .withSuccessHandler(function (created) {
          if (created && created.length) {
            toast('Триггеры восстановлены ✓ ' + created.join(', '));
          } else {
            toast('Триггеры уже на месте ✓');
          }
          load();
        })
        .withFailureHandler(function (err) { toast((err && err.message) || 'Ошибка установки триггеров', true); })
        .ensureTriggersFromUi(initData);
    }

    function runCheck() {
      var initData = getInitData();
      var btn = document.getElementById('btnRun');
      if (btn) btn.disabled = true;
      google.script.run
        .withSuccessHandler(function () {
          toast('Проверка запущена…');
          setTimeout(function () {
            if (btn) btn.disabled = false;
            load();
          }, 4000);
        })
        .withFailureHandler(function (err) {
          if (btn) btn.disabled = false;
          toast((err && err.message) || 'Ошибка запуска', true);
        })
        .runMonitorFromUi(initData);
    }

    // --- UI helpers ---
    function flagEmoji(code) {
      if (!code) { return ''; }
      return String.fromCodePoint.apply(null, String(code).toUpperCase().split('').map(function (ch) {
        return 127397 + ch.charCodeAt(0);
      }));
    }

    var MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
    function shortDate(iso) {
      var d = new Date(String(iso).slice(0, 10) + 'T00:00:00');
      if (isNaN(d.getTime())) { return String(iso); }
      return d.getDate() + ' ' + MONTHS_SHORT[d.getMonth()];
    }

    function timeAgo(iso) {
      if (!iso) { return 'никогда'; }
      var t = new Date(iso).getTime();
      if (isNaN(t)) { return String(iso); }
      var diff = Math.max(0, (Date.now() - t) / 1000);
      if (diff < 60) { return 'только что'; }
      var m = Math.floor(diff / 60);
      if (m < 60) { return m + ' мин назад'; }
      var h = Math.floor(m / 60);
      if (h < 24) { return h + ' ч назад'; }
      return Math.floor(h / 24) + ' дн назад';
    }

    function isTruthy(value) {
      if (typeof value === 'boolean') { return value; }
      var text = String(value).trim().toLowerCase();
      return text === 'true' || text === '1' || text === 'yes' || text === 'y';
    }

    function fieldLabel(text) {
      var label = document.createElement('span');
      label.className = 'field-label';
      label.textContent = text;
      return label;
    }
    function fieldGroup(labelText, child) {
      var div = document.createElement('div');
      if (labelText) {
        var label = fieldLabel(labelText);
        div.appendChild(label);
      }
      div.appendChild(child);
      return div;
    }
    function textInput(value, onInput) {
      var input = document.createElement('input');
      input.type = 'text';
      input.value = value == null ? '' : value;
      input.oninput = function () { onInput(input.value); };
      return input;
    }
    function select(options, value, onPick) {
      var sel = document.createElement('select');
      options.forEach(function (opt) {
        var el = document.createElement('option');
        el.value = opt;
        el.textContent = opt;
        sel.appendChild(el);
      });
      sel.value = value;
      sel.onchange = function () { onPick(sel.value); };
      return sel;
    }
    function countrySelect(value, onPick, allowAll) {
      var sel = document.createElement('select');
      if (allowAll) {
        var anyEl = document.createElement('option');
        anyEl.value = '';
        anyEl.textContent = '🌍 Любая страна';
        sel.appendChild(anyEl);
      }
      (state.countries || []).forEach(function (c) {
        var el = document.createElement('option');
        el.value = c[0];
        el.textContent = flagEmoji(c[0]) + ' ' + c[1];
        sel.appendChild(el);
      });
      sel.value = value || '';
      sel.onchange = function () { onPick(sel.value); };
      return sel;
    }

    function toast(message, isError) {
      var el = document.getElementById('toast');
      el.textContent = message;
      el.className = 'show' + (isError ? ' err' : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.className = ''; }, 2500);
    }

    window.onload = init;
  </script>
</body>
</html>
